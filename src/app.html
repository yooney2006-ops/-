<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짐로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fig-muscle:#e6dccb; --fig-deep:#d8ccb8; --fig-tendon:#e6dccb; --fig-head:#e9e0d0; --fig-hair:#c9bca6; --fig-plate:#3f434c; --fig-skin:#e9e0d0; --fig-shorts:#2a2e36; --fig-prim:#d23f2a; --fig-sec:#ef9c76; --fig-metal:#8a909c; --fig-pad:#3a3f4b; --fig-frame:#5b6170; --fig-floor:#e6e9ee; --fig-bg:#f6f7fa;
  /* 팔레트: 차가운 회색 바탕 + 시그널 오렌지 강조, 매크로는 고정 색 3개 */
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f6f7fa; --ink:#141927; --muted:#646c80; --line:#dfe3ea;
  --accent:#ee5113; --accent-ink:#ffffff; --accent-soft:#fde8de;
  --carb:#d99206; --prot:#2563eb; --fat:#d6336c; --good:#15924f; --warn:#c77700; --bad:#d13b3b;
  --display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
  /* 레이아웃: 폰 폭 단일 컬럼 앱, 상단 날짜 + 탭, 카드 스택 */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fig-muscle:#d9cfbd; --fig-deep:#c9bda8; --fig-tendon:#d9cfbd; --fig-head:#ddd3c2; --fig-hair:#bcae97; --fig-plate:#5a5f69; --fig-skin:#ddd3c2; --fig-shorts:#15181e; --fig-prim:#ff5a40; --fig-sec:#f3a885; --fig-metal:#a5abb7; --fig-pad:#2a2f3a; --fig-frame:#6c7383; --fig-floor:#2a303c; --fig-bg:#1e232e;
    --bg:#0e1117; --surface:#171b24; --surface-2:#1e232e; --ink:#e8ebf2; --muted:#959cae; --line:#2a303c;
    --accent:#ff6b30; --accent-ink:#130a05; --accent-soft:#3a2016;
    --carb:#f0aa22; --prot:#5b8cff; --fat:#f0628f; --good:#3cc47a; --warn:#f0a530; --bad:#ff6a6a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --fig-muscle:#d9cfbd; --fig-deep:#c9bda8; --fig-tendon:#d9cfbd; --fig-head:#ddd3c2; --fig-hair:#bcae97; --fig-plate:#5a5f69; --fig-skin:#ddd3c2; --fig-shorts:#15181e; --fig-prim:#ff5a40; --fig-sec:#f3a885; --fig-metal:#a5abb7; --fig-pad:#2a2f3a; --fig-frame:#6c7383; --fig-floor:#2a303c; --fig-bg:#1e232e;
  --bg:#0e1117; --surface:#171b24; --surface-2:#1e232e; --ink:#e8ebf2; --muted:#959cae; --line:#2a303c;
  --accent:#ff6b30; --accent-ink:#130a05; --accent-soft:#3a2016;
  --carb:#f0aa22; --prot:#5b8cff; --fat:#f0628f; --good:#3cc47a; --warn:#f0a530; --bad:#ff6a6a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 8px;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0}
.brand h1 span{color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .d{font-weight:600;min-width:118px;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:8px 4px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.icon{width:34px;height:34px;padding:0;display:inline-grid;place-items:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ai::before{content:"✦ ";color:var(--accent)}
.btn.primary.ai::before{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:grid;gap:12px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:15px;margin:0;font-weight:700}
.card h3{font-size:14px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.chip{cursor:pointer}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.kcal-big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.macro{display:grid;gap:4px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px}
.macros{display:grid;gap:10px}
.ring{width:110px;height:110px}
.meal{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.meal:first-of-type{border-top:0;margin-top:0;padding-top:0}
.item{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .name{font-weight:600}
.pcf{display:flex;gap:8px;font-size:12px}
.pcf b{font-weight:600}
.c{color:var(--carb)} .p{color:var(--prot)} .f{color:var(--fat)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:28px;height:28px;cursor:pointer;font-weight:700}
.stepper span{min-width:40px;text-align:center;font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:440px){.grid3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.kcal-big{font-size:34px}}
.ex{padding:12px 14px}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-title{font-weight:700;font-size:16px}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center}
.set.lg{grid-template-columns:26px 1fr 1fr 58px 44px;gap:6px}
.set select{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 2px;text-align:center;font-family:var(--display);font-weight:600;width:100%}
.badge-s{background:color-mix(in srgb,var(--prot) 14%,transparent);color:var(--prot);border-color:color-mix(in srgb,var(--prot) 35%,transparent)}
.ev{border-top:1px solid var(--line);padding:10px 0}.ev:first-of-type{border-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calc{border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--display)}
.exrow{all:unset;flex:1;cursor:pointer;display:block;min-width:0}
.exrow:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.ev summary{cursor:pointer;font-weight:700;list-style:none}.ev summary::-webkit-details-marker{display:none}
.ev summary::before{content:"▸ ";color:var(--accent)}.ev[open] summary::before{content:"▾ "}
.set.hdr{font-size:12px;color:var(--muted);font-weight:600}
.set input{text-align:center;padding:7px 4px;font-family:var(--display);font-weight:600}
.set .n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.check{width:44px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:800;color:var(--muted)}
.set.done .check{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.adjust{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.hint{font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;min-width:0}
.wd .l{font-size:12px;color:var(--muted);font-weight:600}
.wd .t{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd .dot{display:block;width:6px;height:6px;border-radius:99px;margin:4px auto 0;background:var(--line)}
.wd.done .dot{background:var(--good)}
.wd.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.rec .m{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface-2)}
.rec .m b{display:block;font-size:13px}
.rec .m .bar{height:5px;margin-top:4px}
.plan-day{display:grid;gap:8px}
.plan-day .pi{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.plan-day .pi:last-child{border-bottom:0}
.tip-list{margin:6px 0 0;padding-left:18px}
.tip-list li{margin:3px 0}
.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.ai-out{white-space:pre-wrap;font-size:14px;line-height:1.65;background:var(--surface-2);border-radius:10px;padding:12px;border:1px solid var(--line)}
.status{font-size:12px;color:var(--muted)}
.status b{color:var(--ink);font-weight:600}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:50;display:none}
.backdrop.open{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;z-index:51;padding:16px 16px 28px;display:none;border:1px solid var(--line)}
.sheet.open{display:block}
.sheet h2{margin:0 0 10px;font-size:17px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.results{display:grid;gap:4px;margin-top:8px;max-height:46vh;overflow:auto}
.res{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.res:hover{border-color:var(--muted)}
.res.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.timer.on{display:flex}
.timer .tt{font-family:var(--display);font-weight:800;font-size:22px;min-width:64px;text-align:center}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:8px;padding:4px 8px;cursor:pointer;font-weight:600}
svg text{fill:var(--muted);font-family:var(--body)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:60;font-size:14px;display:none}
.toast.on{display:block}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .35s ease}}
.viewer{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.viewer canvas{width:100%;height:320px;display:block;touch-action:none;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.vctl{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--surface)}
.vhint{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin-top:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.gx{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.gx:hover{border-color:var(--muted)}
.gx .nm{font-weight:700}
.gx .tg{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.gx .tg b{color:var(--accent);font-weight:600}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.ms{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.ms .bar{height:9px;position:relative}
.ms .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 18%,transparent)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>짐로그<span>.</span></h1>
      <div class="row">
        <span class="status" id="saveStatus">저장: <b>준비 중</b></span>
        <button class="btn sm" data-act="openProfile">내 정보·목표</button>
      </div>
    </div>
    <div class="spread">
      <div class="datenav">
        <button class="btn icon" data-act="day" data-d="-1" aria-label="전날">‹</button>
        <div class="d" id="dateLabel"></div>
        <button class="btn icon" data-act="day" data-d="1" aria-label="다음날">›</button>
      </div>
      <button class="btn sm ghost" data-act="today">오늘로</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-act="tab" data-tab="food">식단</button>
      <button role="tab" data-act="tab" data-tab="workout">운동</button>
      <button role="tab" data-act="tab" data-tab="plan">주간 플랜</button>
      <button role="tab" data-act="tab" data-tab="guide">운동 가이드</button>
    </nav>
  </header>
  <main id="view" class="stack"></main>
</div>
<div class="backdrop" id="backdrop" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="timer" id="timer">
  <span class="xs">휴식</span><span class="tt" id="timerT">1:30</span>
  <button data-act="timerAdd" data-s="-15">−15</button><button data-act="timerAdd" data-s="30">+30</button><button data-act="timerStop">끄기</button>
</div>
<div class="toast" id="toast"></div>

function lsLoad(){ try{ const t=localStorage.getItem(LS_KEY); if(t){ const v=JSON.parse(t); if(v&&v.main) S=v; } }catch(e){} }

function dayKey(d){ return "d-"+d; }
function markDirty(key){
  lsSave();
  if(store.mode!=="db") return;
  store.dirty.add(key);
  clearTimeout(store.timer);
  setStatus("저장 중…");
  store.timer=setTimeout(flush,700);
}
function flush(){
  const keys=[...store.dirty]; store.dirty.clear();
  store.chain = store.chain.then(async()=>{
    for(const k of keys){
      const body = k==="main" ? S.main : (S.days[k.slice(2)]||{meals:[],workout:{items:[]}});
      try{ await store.db.collection("data/users/"+store.uid).doc(k).set(JSON.parse(JSON.stringify(body))); }
      catch(e){
        if(e&&e.code==="unavailable"){ await sleep(800+Math.random()*800); try{ await store.db.collection("data/users/"+store.uid).doc(k).set(JSON.parse(JSON.stringify(body))); continue; }catch(e2){} }
        setStatus("저장 실패 · 이 브라우저에만 저장됨", true); return;
      }
    }
    setStatus("클라우드 저장됨");
  });
}
function setStatus(t,warn){ const el=document.getElementById("saveStatus"); el.innerHTML="저장: <b"+(warn?' style="color:var(--bad)"':"")+">"+esc(t)+"</b>"; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function initCloud(){
  if(!window.claude||!claude.use){ setStatus("이 브라우저"); return; }
  let done=false;
  const to=setTimeout(()=>{ if(!done) setStatus("클라우드 연결 안 됨 · 이 브라우저",true); },10000);
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){ done=true; clearTimeout(to); setStatus("이 브라우저"); return; }
    const uid=await user.id();
    if(!uid){ done=true; clearTimeout(to); setStatus("이 브라우저"); return; }
    const snap=await db.collection("data/users/"+uid).get();
    done=true; clearTimeout(to);
    store.db=db; store.uid=uid; store.mode="db";
    if(snap.empty){
      // 첫 접속: 현재(브라우저) 데이터를 클라우드로 올림
      markDirty("main"); Object.keys(S.days).forEach(d=>markDirty(dayKey(d)));
      setStatus("클라우드 저장됨");
    }else{
      const next={main:S.main,days:{}};
      snap.docs.forEach(d=>{ const v=d.data(); if(d.id==="main") next.main=v; else if(d.id.startsWith("d-")) next.days[d.id.slice(2)]=v; });
      S=JSON.parse(JSON.stringify(next)); lsSave(); render();
      setStatus("클라우드 저장됨");
    }
  }catch(e){ done=true; clearTimeout(to); setStatus("이 브라우저"); }
}

/* Claude (sample) */
let samplePromise=null;
function getSample(){
  if(!samplePromise){ samplePromise = (window.claude&&claude.use) ? claude.use("sample").catch(()=>null) : Promise.resolve(null); }
  return samplePromise;
}
async function askJSON(prompt, opts={}){
  const s=await getSample(); if(!s) throw {code:"none"};
  if(typeof s.json==="function") return await s.json(prompt, opts);
  const r=await s(prompt,opts); const m=(r.text||"").match(/[\[{][\s\S]*[\]}]/); return JSON.parse(m?m[0]:r.text);
}
async function askText(prompt, onText){
  const s=await getSample(); if(!s) throw {code:"none"};
  const r=await s(prompt,{onText:onText?({text})=>onText(text):undefined});
  return r.text;
}
function aiErr(e){
  if(!e) return "알 수 없는 오류가 났어요.";
  if(e.code==="none"||e.code==="not_granted") return "이 화면에서는 Claude 기능을 쓸 수 없어요. claude.ai에서 앱을 열고 권한을 허용해 주세요.";
  if(e.code==="rate_limited") return "요청이 잠시 많아요. 1분쯤 뒤에 다시 눌러 주세요.";
  return "Claude 응답을 읽지 못했어요. 다시 시도해 주세요."+(e.message?" ("+e.message+")":"");
}

function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}
function wIdx(s){return (parseD(s).getDay()+6)%7}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function r1(n){return Math.round((+n||0)*10)/10}
function r0(n){return Math.round(+n||0)}
function uid(){return Math.random().toString(36).slice(2,9)}
function day(d=ui.date){ if(!S.days[d]) S.days[d]={meals:[],workout:{items:[]}}; const v=S.days[d]; v.meals=v.meals||[]; v.workout=v.workout||{items:[]}; v.workout.items=v.workout.items||[]; return v; }
function peekDay(d){ return S.days[d]||{meals:[],workout:{items:[]}}; }
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),2200)}
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}

/* ============================================================
   목표 계산 (Mifflin-St Jeor)
   ============================================================ */
const GOALS={cut:"감량",keep:"유지",bulk:"벌크업(증량)"};
const ACTS=[[1.2,"거의 안 움직임"],[1.375,"주 1~3회 운동"],[1.55,"주 3~5회 운동"],[1.725,"주 6~7회 운동"],[1.9,"육체노동 + 운동"]];
function calcTargets(){
  const p=S.main.profile;
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  const tdee=bmr*p.activity;
  const kcal=p.goal==="cut"?tdee-450:p.goal==="bulk"?tdee+300:tdee;
  const protein=p.weight*(p.goal==="keep"?1.6:p.goal==="cut"?2.2:1.8); // Morton 2018
  const fat=kcal*0.25/9;
  const carb=Math.max(0,(kcal-protein*4-fat*9)/4);
  const auto={kcal:r0(kcal),carb:r0(carb),protein:r0(protein),fat:r0(fat),bmr:r0(bmr),tdee:r0(tdee)};
  const o=S.main.override;
  return o?{...auto,...o,bmr:auto.bmr,tdee:auto.tdee,manual:true}:auto;
}
function sumMeals(meals){
  const t={kcal:0,carb:0,protein:0,fat:0,sugar:0,sodium:0};
  meals.forEach(m=>{for(const k in t) t[k]+=(m[k]||0)*(m.qty||1)});
  return t;
}

/* ============================================================
   운동: 회복도 / 추천 / 기록
   ============================================================ */
function exInfo(it){ return EXMAP[it.exId]||null; }
function exType(it){ const e=exInfo(it); return it.type||(e?e.type:"w"); }
function exPart(it){ const e=exInfo(it); return it.part||(e?e.part:"기타"); }
function doneSets(it){ return (it.sets||[]).filter(s=>s.done); }
function itemVolume(it){ const t=exType(it); return doneSets(it).reduce((a,s)=>a+(t==="w"?(+s.w||0)*(+s.r||0):0),0); }
function e1rm(w,r){ return r>0&&w>0? w*(1+r/30):0; }

// 근육 회복도 (근거: Morán-Navarro 2017, Goulart 2021 — 실패 훈련은 회복 24~48h 지연, 최소 48h)
const BIGG=new Set(["대퇴사두","햄스트링","둔근","등","가슴"]);
function groupWeights(it){ // 근육군별 fractional 가중치 (Pelland 2025: 주동 1, 보조 0.5)
  const e=exInfo(it), w={};
  if(!e){ const g=PART2G[exPart(it)]; if(g) w[g]=1; return w; }
  MGROUP.forEach(([g,ks])=>{ if(e.prim.some(k=>ks.includes(k))) w[g]=1; else if(e.sec.some(k=>ks.includes(k))) w[g]=.5; });
  return w;
}
function rirOf(s){ return (s.rir===""||s.rir==null)?2:+s.rir; }
function recFactor(rir){ return rir<=0?1.3:rir===1?1.15:rir===2?1:rir===3?.85:.7; }
function refMs(d){ return d===ymd(new Date())?Date.now():parseD(d).getTime()+12*3600000; }
function fatigueAt(atMs,refDate){
  const F={}; MGROUP.forEach(([g])=>F[g]=0);
  for(let i=0;i<6;i++){ const d=addDays(refDate,-i); const v=S.days[d]; if(!v||!v.workout) continue;
    (v.workout.items||[]).forEach(it=>{ const W=groupWeights(it); if(exType(it)==="t") return;
      doneSets(it).forEach(st=>{ const t=st.t||parseD(d).getTime()+18*3600000; const hrs=(atMs-t)/3600000; if(hrs<0) return; const rir=rirOf(st);
        for(const g in W){ const tau=48+(rir<=0?24:rir===1?12:0)+(BIGG.has(g)?12:0); F[g]+=W[g]*recFactor(rir)*Math.max(0,1-hrs/tau); } });
    });
  }
  return F;
}
function recovery(refDate){
  const at=refMs(refDate), F=fatigueAt(at,refDate), out={};
  MGROUP.forEach(([g])=>{ const r=Math.max(0,Math.round(100-F[g]*8)); let h=0;
    if(r<90){ for(h=2;h<=120;h+=2){ const F2=fatigueAt(at+h*3600000,refDate); if(100-F2[g]*8>=90) break; } }
    out[g]={r,h}; });
  return out;
}
function prevRecord(name, before){
  const dates=Object.keys(S.days).filter(d=>d<before).sort().reverse();
  for(const d of dates){
    const it=(S.days[d].workout?.items||[]).find(x=>x.name===name&&doneSets(x).length);
    if(it) return {date:d,sets:doneSets(it),type:exType(it)};
  }
  return null;
}
// 점진적 과부하 제안
function suggestNext(it, before){
  const pr=prevRecord(it.name,before); if(!pr) return null;
  const t=pr.type; const top=pr.sets.reduce((a,s)=>(+s.w||0)>(+a.w||0)?s:a,pr.sets[0]);
  const target=(it.sets&&it.sets[0]&&+it.sets[0].r)||+top.r||10;
  const allHit=pr.sets.every(s=>(+s.r||0)>=target);
  const rirs=pr.sets.map(s=>s.rir).filter(v=>v!==""&&v!=null).map(Number); const minR=rirs.length?Math.min(...rirs):null;
  if(t==="w"){
    const inc=(exInfo(it)?.part==="하체"||it.exId==="deadlift")?5:2.5;
    if(allHit&&minR!=null&&minR>=3) return {w:r1((+top.w||0)+inc*2),r:target,msg:`지난번 ${top.w}kg×${top.r}에 RIR ${minR} (여유 많음) → +${inc*2}kg`};
    if(allHit) return {w:r1((+top.w||0)+inc),r:target,msg:`지난번 ${top.w}kg×${top.r} 모두 성공${minR!=null?` (RIR ${minR})`:""} → +${inc}kg 도전`};
    return {w:+top.w||0,r:target,msg:`지난번 ${top.w}kg에서 목표 횟수 미달 → 같은 무게로 ${target}회 채우기`};
  }
  if(t==="b") return {w:0,r:allHit?target+1:target,msg:allHit?`지난번 ${top.r}회 성공 → ${target+1}회 도전`:`지난번 ${top.r}회 → ${target}회 채우기`};
  return null;
}
function mkItem(e, sets, reps, w){
  return {id:uid(),exId:e?e.id:null,name:e?e.name:"",part:e?e.part:"기타",type:e?e.type:"w",rest:e?e.rest:90,sets:Array.from({length:sets},()=>({w:w??(e?e.def[2]:0),r:reps??(e?e.def[1]:10),done:false}))};
}
function cloneItems(items){ return JSON.parse(JSON.stringify(items||[])).map(it=>({...it,id:uid(),sets:(it.sets||[]).map(s=>({w:s.w,r:s.r,done:false,rir:""}))})); }

const FREE_PREF={chest_press:"bench",leg_press:"front_squat",lat_pd:"pullup",seated_row:"bb_row",leg_ext:"goblet",cable_oh:"oh_ext",triceps_pd:"skull",pec_deck:"db_fly",calf_raise:"calf_raise",hip_thrust_m:"hip_thrust"};
const NOGYM={bench:"pushup",seated_curl:"rdl",cable_oh:"oh_ext",preacher:"hammer_curl",lat_pd:"pullup",seated_row:"db_row",leg_press:"lunge",leg_ext:"lunge",leg_curl:"rdl",cable_cross:"db_fly",triceps_pd:"skull",face_pull:"rear_delt",cable_crunch:"hanging_lr",bb_row:"db_row",squat:"lunge",deadlift:"rdl",calf_raise:"lunge",ohp:"lateral",hip_thrust:"lunge",bb_curl:"hammer_curl",incline_walk:"bike"};
function makeTemplate({days,goal,level,equip,focus=[],pref="mix"}){
  const sp=SPLITS[Math.min(6,Math.max(2,days))];
  // 반복·RIR (Schoenfeld 2017: 실패 근처면 무게 범위 무관 / Robinson 2024: 근비대는 RIR 0~2)
  const R=goal==="strength"?{main:5,acc:8,rirM:"2–3",rirA:"1–2"}:goal==="fit"?{main:12,acc:15,rirM:"2–3",rirA:"1–3"}:{main:8,acc:12,rirM:"1–2",rirA:"0–1"};
  const nSets=level==="beg"?3:level==="adv"?4:3;
  const plan=Array.from({length:7},()=>({title:"휴식",items:[]}));
  sp.sessions.forEach(([title,ids],i)=>{
    let list=ids.slice();
    if(level==="beg") list=list.slice(0,4);
    if(equip!=="gym") list=list.map(id=>NOGYM[id]||id);
    else if(pref==="machine") list=list.map(id=>MACHINE_PREF[id]||id);
    else if(pref==="free") list=list.map(id=>FREE_PREF[id]||id);
    else if(pref==="brand") list=list.map(id=>BRAND_PREF[MACHINE_PREF[id]||id]||BRAND_PREF[id]||MACHINE_PREF[id]||id);
    list=list.filter((v,j,a)=>a.indexOf(v)===j&&EXMAP[v]);
    focus.forEach(fp=>{ if(list.some(id=>EXMAP[id]?.part===fp)){ const extra=EX.find(e=>e.part===fp&&!list.includes(e.id)&&e.stretch&&(equip==="gym"||e.cat==="맨몸"||e.equip.includes("덤벨")))||EX.find(e=>e.part===fp&&!list.includes(e.id)&&(equip==="gym"||e.cat==="맨몸"||e.equip.includes("덤벨"))); if(extra) list.push(extra.id); } });
    const items=list.map((id,k)=>{ const e=EXMAP[id]; const main=e.compound&&k<2; const r=e.type==="t"?e.def[1]:(main?R.main:R.acc); const it=mkItem(e,e.type==="t"?e.def[0]:nSets+(main&&level!=="beg"?1:0),r,e.def[2]); it.rirT=main?R.rirM:R.rirA; return it; });
    if(goal==="cut"||goal==="fit") items.push(mkItem(EXMAP[equip==="gym"?"incline_walk":"bike"],1,20,0));
    plan[sp.days[i]]={title,items};
  });
  balancePlan(plan,level,goal,{equip,R});
  return {name:sp.name,days:plan};
}
/* 플랜 볼륨 분석 (fractional sets, 빈도, 세션 최대치) */
function planStats(plan){
  const st={}; MGROUP.forEach(([g])=>st[g]={sets:0,freq:0,maxS:0});
  plan.forEach(p=>{ const day={}; (p.items||[]).forEach(it=>{ if(exType(it)==="t") return; const W=groupWeights(it); const n=(it.sets||[]).length; for(const g in W) day[g]=(day[g]||0)+W[g]*n; });
    for(const g in day){ st[g].sets+=day[g]; if(day[g]>=1) st[g].freq++; st[g].maxS=Math.max(st[g].maxS,day[g]); } });
  return st;
}
const VOL_RANGE=lv=>lv==="beg"?[6,12]:[10,20];
function balancePlan(plan,level,goal,ctx={}){
  if(goal==="strength") return;
  const [lo,hi]=VOL_RANGE(level); const major=["가슴","등","어깨","이두","삼두","대퇴사두","햄스트링","둔근"];
  const okEquip=e=>ctx.equip!=="home"||e.cat==="맨몸"||e.equip.includes("덤벨");
  for(let pass=0;pass<40;pass++){
    let changed=false;
    // 1) 세션당 상한 (~11 fractional sets)
    plan.forEach(p=>{ if(changed) return; const ds=planStats([p]); for(const g of major){ if(ds[g].sets>11){ const c=p.items.filter(it=>groupWeights(it)[g]===1&&it.sets.length>2).sort((a,b)=>b.sets.length-a.sets.length)[0]; if(c){ c.sets.pop(); changed=true; return; } } } });
    if(changed) continue;
    const st=planStats(plan);
    for(const g of major){
      if(st[g].sets<lo){
        const cands=[];plan.forEach((p,d)=>p.items.forEach(it=>{if(groupWeights(it)[g]===1&&it.sets.length<5&&planStats([p])[g].sets+1<=11)cands.push(it);}));
        cands.sort((a,b)=>a.sets.length-b.sets.length);
        if(cands.length){ const it=cands[0],l=it.sets[it.sets.length-1]; it.sets.push({w:l.w,r:l.r,done:false}); changed=true; break; }
        // 해당 부위 주동 운동이 없으면 고립운동 추가 (스트레치 강조 우선)
        const ks=MGROUP.find(x=>x[0]===g)[1];
        const days=plan.map((p,d)=>({p,d,n:planStats([p])[g].sets,len:p.items.length})).filter(x=>x.len&&x.n+3<=11).sort((a,b)=>a.n-b.n||a.len-b.len);
        if(days.length){ const tgt=days[0].p; const have=new Set(tgt.items.map(x=>x.exId));
          const pool=EX.filter(e=>e.type==="w"&&!e.compound&&okEquip(e)&&!have.has(e.id)&&e.prim.some(k=>ks.includes(k)));
          const e=pool.find(x=>x.stretch)||pool[0];
          if(e){ const it=mkItem(e,3,(ctx.R&&ctx.R.acc)||12,e.def[2]); it.rirT=(ctx.R&&ctx.R.rirA)||"0–1"; const cardio=tgt.items.findIndex(x=>exType(x)==="t"); if(cardio>=0) tgt.items.splice(cardio,0,it); else tgt.items.push(it); changed=true; break; } }
      } else if(st[g].sets>hi){
        const cands=[];plan.forEach(p=>p.items.forEach(it=>{if(groupWeights(it)[g]===1&&it.sets.length>(exInfo(it)?.compound?3:2))cands.push(it);}));
        if(cands.length){ cands.sort((a,b)=>(!!exInfo(a)?.compound-!!exInfo(b)?.compound)||b.sets.length-a.sets.length); cands[0].sets.pop(); changed=true; break; }
      }
    }
    if(!changed) break;
  }
}
/* 주간 플랜 피드백: 근거 규칙 기반 좋은 점·아쉬운 점 */
function planFeedback(plan,level){
  const st=planStats(plan), [lo,hi]=VOL_RANGE(level||"mid"), good=[], bad=[];
  const major=["가슴","등","어깨","이두","삼두","대퇴사두","햄스트링","둔근"];
  const days=plan.map((p,i)=>({i,items:p.items||[]})).filter(d=>d.items.length);
  if(!days.length) return {good,bad:[{t:"플랜이 비어 있어요. 추천 플랜을 받거나 요일별로 운동을 추가하세요.",ev:""}]};
  const all=days.flatMap(d=>d.items); const has=f=>all.some(it=>{const e=exInfo(it);return e&&f(e);});
  // 1) 볼륨
  const ok=major.filter(g=>st[g].sets>=lo&&st[g].sets<=hi), under=major.filter(g=>st[g].sets<lo), over=major.filter(g=>st[g].sets>hi);
  if(ok.length) good.push({t:`${ok.join("·")}의 주간 볼륨이 권장 범위(${lo}~${hi}세트)에 있어요.`,ev:"Pelland 2025"});
  under.forEach(g=>bad.push({t:`${g} ${r1(st[g].sets)}세트로 부족해요. 주동 운동을 ${Math.ceil(lo-st[g].sets)}세트 이상 늘리면 성장 여지가 커요.`,ev:"Pelland 2025"}));
  over.forEach(g=>bad.push({t:`${g} ${r1(st[g].sets)}세트는 많은 편이에요. 세트를 더해도 효율이 점점 줄어서, 회복 여유가 없으면 줄이는 걸 권해요.`,ev:"Pelland 2025"}));
  // 2) 빈도·세션 상한
  const f2=major.filter(g=>st[g].sets>=lo&&st[g].freq>=2), f1=major.filter(g=>st[g].sets>=4&&st[g].freq===1);
  if(f2.length>=5) good.push({t:"주요 부위 대부분을 주 2회 이상 나눠서 훈련해요. 한 세션에 볼륨이 몰리지 않아 좋아요.",ev:"Pelland 2025"});
  if(f1.length) bad.push({t:`${f1.join("·")}는 주 1회만 훈련해요. 같은 세트를 2회로 나누면 세션 질과 회복에 유리해요.`,ev:"Pelland 2025"});
  const cap=major.filter(g=>st[g].maxS>11); if(cap.length) bad.push({t:`${cap.map(g=>`${g}(한 세션 ${r1(st[g].maxS)}세트)`).join(", ")}: 세션당 약 11세트를 넘으면 추가 세트의 효과가 크게 줄어드는 경향이 있어요.`,ev:"Pelland 2024 프리프린트"});
  // 3) 늘어난 위치 운동
  const hamS=has(e=>e.prim.includes("ham")&&e.stretch), triOH=has(e=>e.id==="oh_ext"||e.id==="cable_oh");
  if(hamS) good.push({t:"햄스트링을 늘어난 위치에서 훈련하는 운동(앉은 레그컬·RDL 등)이 있어요.",ev:"Maeo 2021"});
  else if(st["햄스트링"].sets>0||st["대퇴사두"].sets>0) bad.push({t:"햄스트링 운동이 엎드린 레그컬 위주예요. 앉은 레그컬이나 RDL로 바꾸면 성장이 더 컸다는 연구가 있어요(+14% vs +9%).",ev:"Maeo 2021"});
  if(triOH) good.push({t:"삼두에 오버헤드 익스텐션이 들어가 있어 장두를 늘어난 위치에서 자극해요.",ev:"Maeo 2023"});
  else if(st["삼두"].sets>0) bad.push({t:"삼두 운동에 오버헤드 익스텐션이 없어요. 푸시다운만 할 때보다 삼두 성장이 컸어요(+19.9% vs +13.9%).",ev:"Maeo 2023"});
  // 4) 밀기·당기기 / 대퇴사두·햄스트링 / 후면 삼각근
  const push=st["가슴"].sets, pull=st["등"].sets;
  if(push>0&&pull>=push*.9) good.push({t:`당기기(등 ${r1(pull)}세트)가 밀기(가슴 ${r1(push)}세트) 이상이라 어깨 균형이 좋아요.`,ev:"일반 권장"});
  else if(push>0) bad.push({t:`등(${r1(pull)}세트)이 가슴(${r1(push)}세트)보다 적어요. 로우·풀다운을 더해 밀기:당기기 균형을 맞추세요.`,ev:"일반 권장"});
  const q=st["대퇴사두"].sets,h=st["햄스트링"].sets;
  if(q>0&&h<q*.6) bad.push({t:`햄스트링(${r1(h)})이 대퇴사두(${r1(q)})에 비해 적어요. 힙힌지나 레그컬을 추가하세요.`,ev:"일반 권장"});
  if(!has(e=>e.prim.includes("rdelt"))&&!has(e=>e.sec.includes("rdelt")&&e.prim.includes("rhom"))) bad.push({t:"후면 삼각근을 주로 쓰는 운동(페이스풀·리어델트 플라이)이 없어요. 어깨 건강과 균형을 위해 주 1~2회 넣어 보세요.",ev:"일반 권장"});
  // 5) 연속일 회복
  const consec=[];for(let i=0;i<7;i++){const a=planStats([plan[i]]),b=planStats([plan[(i+1)%7]]);major.forEach(g=>{if(a[g].sets>=6&&b[g].sets>=6)consec.push(`${WD[i]}·${WD[(i+1)%7]} ${g}`);});}
  if(consec.length) bad.push({t:`${consec.slice(0,3).join(", ")}: 같은 부위를 이틀 연속 6세트 이상 해요. 실패 근처 훈련 뒤에는 최소 48시간 회복을 권해요.`,ev:"Goulart 2021, Morán-Navarro 2017"});
  else good.push({t:"같은 부위를 이틀 연속 무겁게 훈련하지 않아서, 부위별 회복 간격(48시간 이상)이 확보돼요.",ev:"Goulart 2021"});
  // 6) 세션 길이·휴식일
  const mins=days.map(d=>Math.round(d.items.reduce((a,it)=>a+(exType(it)==="t"?(+it.sets[0]?.r||0)*60:(it.sets||[]).length*((it.rest||exInfo(it)?.rest||90)+40)),0)/60));
  const mx=Math.max(...mins); if(mx>95) bad.push({t:`가장 긴 날이 약 ${mx}분이에요(휴식 포함 추정). 길어지면 후반 세트 질이 떨어지기 쉬워서, 운동을 다른 요일로 옮기는 걸 권해요.`,ev:"추정"});
  else good.push({t:`세션 길이가 약 ${Math.min(...mins)}~${mx}분으로 무리 없는 수준이에요(휴식 포함 추정).`,ev:"추정"});
  if(days.length>=7) bad.push({t:"휴식일이 없어요. 주 1일 이상 쉬는 날을 두세요.",ev:"일반 권장"});
  // 7) RIR·기구
  if(all.some(it=>it.rirT)) good.push({t:"운동마다 목표 RIR이 정해져 있어 실패 근접도를 관리하기 쉬워요.",ev:"Robinson 2024"});
  else bad.push({t:"목표 RIR이 없어요. 근비대 목표라면 고립운동 RIR 0~1, 다관절 1~2를 권해요.",ev:"Robinson 2024"});
  const mc=all.filter(it=>exInfo(it)?.cat==="머신").length, fw=all.filter(it=>exInfo(it)?.cat==="프리웨이트").length;
  good.push({t:`머신 ${mc}개 · 프리웨이트 ${fw}개 구성이에요. 근비대에는 두 방식 차이가 없어서 이 비율 그대로도 괜찮아요.`,ev:"Haugen 2023"});
  return {good,bad};
}
function feedbackHtml(plan,level){
  const {good,bad}=planFeedback(plan,level);
  const li=(x,ok)=>`<li style="margin:6px 0;list-style:none;display:grid;grid-template-columns:20px 1fr;gap:6px"><span style="color:${ok?"var(--good)":"var(--warn)"};font-weight:800">${ok?"✓":"!"}</span><span>${esc(x.t)}${x.ev?` <span class="xs muted">· ${esc(x.ev)}</span>`:""}</span></li>`;
  return `<div style="display:grid;gap:12px"><div><div class="small" style="font-weight:700;color:var(--good)">좋은 점 ${good.length}</div><ul style="padding:0;margin:4px 0" class="small">${good.map(x=>li(x,1)).join("")}</ul></div><div><div class="small" style="font-weight:700;color:var(--warn)">아쉬운 점 ${bad.length}</div><ul style="padding:0;margin:4px 0" class="small">${bad.length?bad.map(x=>li(x,0)).join(""):`<li class="muted" style="list-style:none">특별히 고칠 점이 없어요.</li>`}</ul></div></div>`;
}
function planCheckHtml(plan,level){

  MGROUP.forEach(([g])=>{ const x=st[g]; const v=r1(x.sets);
    const minor=g==="종아리"||g==="복근";
    const tag=x.sets<lo?(minor?["보통","var(--muted)"]:["부족","var(--warn)"]):x.sets>hi?["많음","var(--accent)"]:["적정","var(--good)"];
    const warn=[]; if(x.maxS>11) warn.push(`한 세션 ${r1(x.maxS)}세트 → 나누기 권장`); if(x.sets>=lo&&x.freq<2&&!minor) warn.push("주 1회 → 2회로 나누면 좋아요");

  return h+`</div><p class="xs muted" style="margin:6px 0 0">기준: 부위당 주 ${lo}~${hi}세트(주동 1·보조 0.5), 세션당 약 11세트 이하, 주 2회 이상 · 근거: Pelland 2025</p>`;
}

/* 오늘 자극한 근육 지도 (Hevy 참고) */
function dayMuscles(d){
  const w={}; (peekDay(d).workout?.items||[]).forEach(it=>{ const e=exInfo(it); const n=doneSets(it).length; if(!e||!n||e.type==="t") return; e.prim.forEach(k=>w[k]=(w[k]||0)+n); e.sec.forEach(k=>w[k]=(w[k]||0)+n*.5); });
  return w;
}
function initMuscleMaps(){

  const ex={id:"map",anim:{p:"raise",o:{kind:"shrug",tool:"none"}},prim:keys.filter(k=>w[k]>=3),sec:keys.filter(k=>w[k]<3),cam:[0,6]};
  [["mapFront",15],["mapBack",195]].forEach(([id,yaw])=>{ const cv=document.getElementById(id); if(!cv) return; try{ const v=FIG.viewer(cv,ex,{autoplay:false}); v.setView(yaw,6); v.setSpan(1.75,[0,.98,0]); v.frameAt(0); ui.maps.push(v); }catch(e){} });
}
function plateCalc(total,bar=20){
  let side=(total-bar)/2; if(side<=0) return null; const P=[25,20,15,10,5,2.5,1.25], out=[];
  for(const p of P){ while(side>=p-1e-9){ out.push(p); side-=p; } } return {out,rest:r1(side)};
}

/* ---------- 식단 ---------- */
function macroBar(label,cls,val,target,unit="g"){
  const pct=target?Math.min(100,val/target*100):0; const over=target&&val>target*1.1;
  return `<div class="macro"><div class="spread small"><span class="${cls}" style="font-weight:700">${label}</span><span class="num">${r0(val)}<span class="muted"> / ${r0(target)}${unit}</span>${over?' <span class="chip" style="color:var(--warn)">초과</span>':""}</span></div><div class="bar"><i style="width:${pct}%;background:var(--${cls==="c"?"carb":cls==="p"?"prot":"fat"})"></i></div></div>`;
}
function ring(val,target){
  const pct=target?Math.min(1,val/target):0; const R=46,C=2*Math.PI*R; const over=val>target*1.05;
  return `<svg class="ring" viewBox="0 0 110 110" role="img" aria-label="칼로리 ${r0(val)} / ${r0(target)}"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="${over?"var(--warn)":"var(--accent)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" opacity="${pct>0?1:0}" transform="rotate(-90 55 55)"/><text x="55" y="52" text-anchor="middle" style="font-size:20px;font-weight:800;fill:var(--ink);font-family:var(--display)">${Math.round(pct*100)}%</text><text x="55" y="70" text-anchor="middle" style="font-size:11px">목표 대비</text></svg>`;
}
const MEALS=["아침","점심","저녁","간식"];

        <div class="row"><span class="stepper"><button data-act="qty" data-i="${x._i}" data-d="-0.5" aria-label="줄이기">−</button><span class="num">${q}</span><button data-act="qty" data-i="${x._i}" data-d="0.5" aria-label="늘리기">+</button></span><button class="btn sm icon ghost" data-act="delFood" data-i="${x._i}" aria-label="삭제">✕</button></div></div>`;

  // AI 분석

  return html;
}
function defaultMeal(){ const h=new Date().getHours(); return h<10?"아침":h<15?"점심":h<21?"저녁":"간식"; }
function weekKcalChart(T){
  const ds=Array.from({length:7},(_,i)=>addDays(ui.date,i-6));
  const vals=ds.map(d=>sumMeals(peekDay(d).meals||[]).kcal);
  const max=Math.max(T.kcal*1.25,...vals,100);
  const W=340,H=140,pl=34,pb=22,pt=8,bw=(W-pl-8)/7;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 7일 칼로리">`;
  [0,0.5,1].forEach(f=>{const v=Math.round(max*f/100)*100; s+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(v)+4}" text-anchor="end" style="font-size:10px">${v.toLocaleString()}</text>`;});
  ds.forEach((d,i)=>{const v=vals[i]; const x=pl+i*bw+bw*0.2; const over=v>T.kcal*1.1; const sel=d===ui.date;
    s+=`<rect x="${x}" y="${y(v)}" width="${bw*0.6}" height="${Math.max(0,y(0)-y(v))}" rx="4" fill="${over?"var(--warn)":"var(--accent)"}" opacity="${sel?1:.55}"/>`;
    s+=`<text x="${x+bw*0.3}" y="${H-6}" text-anchor="middle" style="font-size:11px;${sel?"fill:var(--ink);font-weight:700":""}">${WD[wIdx(d)]}</text>`;});
  s+=`<line x1="${pl}" x2="${W-4}" y1="${y(T.kcal)}" y2="${y(T.kcal)}" stroke="var(--ink)" stroke-dasharray="4 4"/></svg>`;
  return s;
}
function weekProtein(T){
  const ds=Array.from({length:7},(_,i)=>addDays(ui.date,i-6)).filter(d=>(peekDay(d).meals||[]).length);
  if(!ds.length) return `<p class="muted small" style="margin:6px 0 0">기록이 쌓이면 주간 평균이 표시돼요.</p>`;
  const avg=k=>ds.reduce((a,d)=>a+sumMeals(peekDay(d).meals)[k],0)/ds.length;
  return `<div class="row small" style="margin-top:6px"><span class="muted">기록한 ${ds.length}일 평균</span><span class="num">${r0(avg("kcal")).toLocaleString()} kcal</span><span class="p">단백질 <b class="num">${r0(avg("protein"))}</b>/${T.protein}g</span><span class="c">탄 <b class="num">${r0(avg("carb"))}</b>g</span><span class="f">지 <b class="num">${r0(avg("fat"))}</b>g</span></div>`;
}

function exCard(it,i,mode){
  const t=exType(it); const e=exInfo(it); const log=mode==="log";
  const unitW=t==="w"?"kg":"", unitR=t==="t"?"분":"회";
  let sug=null, pr=null;
  if(log){ sug=suggestNext(it,ui.date); pr=prevRecord(it.name,ui.date); }
  const best=log&&t==="w"?bestE1rm(it.name):0;
  let h=`<section class="card ex"><div class="ex-head"><div><div class="ex-title">${esc(it.name)}</div><div class="row xs muted" style="margin-top:2px"><span class="chip">${esc(exPart(it))}</span>${e&&e.stretch?`<span class="chip badge-s" title="${esc(e.stretch.note)}">스트레치</span>`:""}${it.rirT?`<span class="chip">목표 RIR ${esc(it.rirT)}</span>`:""}${e?`<span>${esc(e.equip)}</span>`:""}${best?`<span>· 추정 1RM 최고 <b class="num">${r1(best)}</b>kg</span>`:""}</div></div>
    <div class="row"><button class="btn sm ghost" data-act="tips" data-ex="${esc(it.exId||"")}" data-name="${esc(it.name)}">팁</button>${log?`<button class="btn sm ghost" data-act="swap" data-i="${i}" data-target="${mode}">교체</button>`:""}<button class="btn sm icon ghost" data-act="moveEx" data-i="${i}" data-d="-1" data-target="${mode}" aria-label="위로">↑</button><button class="btn sm icon ghost" data-act="delEx" data-i="${i}" data-target="${mode}" aria-label="삭제">✕</button></div></div>`;
  if(log&&pr){ h+=`<div class="xs muted" style="margin-top:6px">지난 기록 (${pr.date.slice(5).replace("-","/")}): ${pr.sets.map(s=>t==="w"?`${s.w}×${s.r}`:`${s.r}${unitR}`).join(", ")}</div>`; }
  if(sug){ h+=`<div class="hint" style="margin-top:6px">추천: ${esc(sug.msg)} <button class="btn sm" data-act="applySug" data-i="${i}" data-w="${sug.w}" data-r="${sug.r}">적용</button></div>`; }
  const lg=log&&t!=="t"?" lg":"";
  h+=`<div class="sets"><div class="set hdr${lg}"><span style="text-align:center">세트</span><span style="text-align:center">${t==="w"?"무게(kg)":t==="t"?"—":"추가중량"}</span><span style="text-align:center">${t==="t"?"시간(분)":"횟수"}</span>${lg?`<span style="text-align:center" title="남은 반복 수: 몇 개 더 할 수 있었나">RIR</span>`:""}<span style="text-align:center">${log?"완료":""}</span></div>`;
  (it.sets||[]).forEach((s,k)=>{
    h+=`<div class="set${lg} ${s.done?"done":""}"><span class="n" ${s.pr?'title="신기록" style="color:var(--accent)"':""}>${s.pr?"★":k+1}</span>
    <input type="number" inputmode="decimal" step="0.5" min="0" value="${s.w}" ${t==="t"?"disabled":""} data-chg="set" data-target="${mode}" data-i="${i}" data-k="${k}" data-f="w" aria-label="${k+1}세트 무게">
    <input type="number" inputmode="numeric" step="1" min="0" value="${s.r}" data-chg="set" data-target="${mode}" data-i="${i}" data-k="${k}" data-f="r" aria-label="${k+1}세트 ${unitR}">
    ${lg?`<select data-chg="rir" data-i="${i}" data-k="${k}" aria-label="${k+1}세트 RIR">${["","0","1","2","3","4"].map(v=>`<option value="${v}" ${String(s.rir??"")===v?"selected":""}>${v===""?"–":v==="4"?"4+":v}</option>`).join("")}</select>`:""}
    ${log?`<button class="check" data-act="toggleSet" data-i="${i}" data-k="${k}" aria-label="${k+1}세트 완료">✓</button>`:`<button class="btn sm icon ghost" data-act="delSet" data-i="${i}" data-k="${k}" data-target="${mode}" aria-label="세트 삭제">−</button>`}</div>`;
  });
  if(log&&t==="w"&&e&&/바벨|스미스|EZ바/.test(e.equip)){ const nx=(it.sets||[]).find(x=>!x.done)||it.sets[0]; const pc=nx?plateCalc(+nx.w,/스미스/.test(e.equip)?0:/EZ/.test(e.equip)?10:20):null;

  h+=`</div><div class="adjust"><button class="btn sm" data-act="setCount" data-i="${i}" data-d="1" data-target="${mode}">+ 세트</button><button class="btn sm" data-act="setCount" data-i="${i}" data-d="-1" data-target="${mode}">− 세트</button>`;

  h+=`<button class="btn sm" data-act="bulk" data-i="${i}" data-f="r" data-d="-1" data-target="${mode}">${unitR} −1</button><button class="btn sm" data-act="bulk" data-i="${i}" data-f="r" data-d="1" data-target="${mode}">${unitR} +1</button>`;
  if(t!=="t") h+=`<label class="row xs muted" style="gap:4px">휴식<select data-chg="rest" data-target="${mode}" data-i="${i}" style="width:auto;padding:4px 6px">${[60,90,120,150,180,240].map(v=>`<option value="${v}" ${(it.rest||e?.rest||90)==v?"selected":""}>${Math.floor(v/60)}:${pad(v%60)}</option>`).join("")}</select></label>`;
  if(log) h+=`<span class="xs muted" style="align-self:center">일괄 조절은 아직 안 끝낸 세트에만 적용</span>`;
  h+=`</div></section>`;
  return h;
}
function bestE1rmBefore(name,date,exclude){
  let b=0; Object.keys(S.days).forEach(d=>{ (S.days[d].workout?.items||[]).forEach(it=>{ if(it.name!==name) return; doneSets(it).forEach(st=>{ if(st===exclude) return; if(d>date) return; b=Math.max(b,e1rm(+st.w,+st.r)); }); }); }); return b;
}
function bestE1rm(name){
  let b=0; Object.values(S.days).forEach(v=>(v.workout?.items||[]).forEach(it=>{ if(it.name===name) doneSets(it).forEach(s=>{ b=Math.max(b,e1rm(+s.w,+s.r)); }); })); return b;
}

const PART2G={"가슴":"가슴","등":"등","어깨":"어깨","팔":"이두","하체":"대퇴사두","코어":"복근"};
function monthCal(){
  const d0=parseD(ui.date); const y=d0.getFullYear(), m=d0.getMonth(); const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(); const off=(first.getDay()+6)%7;
  let n=0; let cells=""; for(let i=0;i<off;i++) cells+=`<span></span>`;
  for(let dd=1;dd<=days;dd++){ const k=ymd(new Date(y,m,dd)); const sets=(S.days[k]?.workout?.items||[]).reduce((a,it)=>a+doneSets(it).length,0); if(sets) n++;
    const lvl=sets===0?0:sets<10?1:sets<20?2:3; const bg=["var(--surface-2)","color-mix(in srgb,var(--accent) 30%,var(--surface))","color-mix(in srgb,var(--accent) 60%,var(--surface))","var(--accent)"][lvl];
    cells+=`<button class="calc" data-act="goDate" data-date="${k}" style="background:${bg};${k===ui.date?"outline:2px solid var(--ink);":""}color:${lvl>=2?"#fff":"var(--ink)"}" aria-label="${m+1}월 ${dd}일 ${sets}세트">${dd}</button>`; }
  return `<section class="card"><div class="spread"><h2>${m+1}월 운동 기록</h2><span class="small muted">운동한 날 <b class="num" style="color:var(--ink)">${n}</b>일</span></div>
  <div class="cal" style="margin-top:8px">${WD.map(w=>`<span class="xs muted" style="text-align:center">${w}</span>`).join("")}${cells}</div></section>`;
}
function weekFreq(ref){ const mon=addDays(ref,-wIdx(ref)); const f={};
  for(let i=0;i<7;i++){ const v=S.days[addDays(mon,i)]; if(!v||!v.workout) continue; const day={};
    (v.workout.items||[]).forEach(it=>{ const n=doneSets(it).length; if(!n) return; const W=groupWeights(it); for(const g in W) day[g]=(day[g]||0)+W[g]*n; });
    for(const g in day) if(day[g]>=1) f[g]=(f[g]||0)+1; }
  return f; }
function weekSets(ref){
  const mon=addDays(ref,-wIdx(ref)); const c={};
  for(let i=0;i<7;i++){ const v=S.days[addDays(mon,i)]; if(!v||!v.workout) continue;
    (v.workout.items||[]).forEach(it=>{ const n=doneSets(it).length; if(!n) return; const e=exInfo(it);
      if(!e){ const g=PART2G[exPart(it)]; if(g) c[g]=(c[g]||0)+n; return; }
      MGROUP.forEach(([g,ks])=>{ if(e.prim.some(k=>ks.includes(k))) c[g]=(c[g]||0)+n; else if(e.sec.some(k=>ks.includes(k))) c[g]=(c[g]||0)+n*.5; });
    });
  }
  return c;
}

function allFoods(){ return [...(S.main.customFoods||[]).map(f=>({...f,custom:true})),...FOOD_DB]; }

const A={

  confirmFood(){ const f=ui.sheet.sel; const d=day(); d.meals.push({id:uid(),meal:ui.sheet.meal,name:f.name,serving:f.serving,grams:f.grams,kcal:f.kcal,carb:f.carb,protein:f.protein,fat:f.fat,sugar:f.sugar||0,sodium:f.sodium||0,qty:ui.sheet.qty,src:f.src||(f.custom?"custom":"db")}); markDirty(dayKey(ui.date)); toast(`${f.name} 추가됨`); ui.sheet.sel=null; ui.sheet.q=""; render(); drawFoodSheet(); },
  qty(el){ const d=day(); const m=d.meals[+el.dataset.i]; m.qty=Math.max(0.5,r1((m.qty||1)+ +el.dataset.d)); markDirty(dayKey(ui.date)); render(); },
  delFood(el){ const d=day(); d.meals.splice(+el.dataset.i,1); markDirty(dayKey(ui.date)); render(); },
  async aiLookup(){ ui.sheet.mode="ai"; ui.sheet.aiText=ui.sheet.q+" 1인분"; drawFoodSheet(); A.aiParse(); },
  async aiParse(){
    const txt=(document.getElementById("aiFoodIn")?.value||"").trim(); if(!txt) return toast("먹은 음식을 적어 주세요");
    ui.sheet.aiText=txt; const out=document.getElementById("aiParseOut"); out.innerHTML=`<p class="muted small">Claude가 분석 중…</p>`; ui.aiBusy=true;
    try{ const r=await askJSON(`너는 한국 영양사다. 사용자가 먹은 음식 설명을 음식 단위로 나누고, 식품의약품안전처 식품영양성분 DB나 일반적인 한국 제품·프랜차이즈 영양성분표 기준으로 1회 제공량 영양성분을 추정하라. 브랜드 제품이면 그 제품 표기를 우선한다.\n${NUTRI_SCHEMA}\n\n사용자 입력: ${txt}`);
      ui.sheet.parsed=(r.items||[]).map(normFood).map(f=>({...f,src:"ai"})); ui.sheet.note=r.note||""; }
    catch(e){ ui.sheet.parsed=null; out.innerHTML=`<p class="small" style="color:var(--bad)">${esc(aiErr(e))}</p>`; ui.aiBusy=false; return; }

    try{

    ui.aiBusy=false;
  },
  guideCat(el){ ui.guideCat=el.dataset.p; render(); },
  guideStretch(){ ui.guideStretch=!ui.guideStretch; render(); },
  guideBrand(el){ ui.guideBrand=el.dataset.p; render(); },
  pickBrand(el){ ui.sheet.brand=el.dataset.p; document.getElementById("exRes").innerHTML=exListHtml(); document.querySelectorAll("[data-act=pickBrand]").forEach(b=>b.classList.toggle("on",b.dataset.p===ui.sheet.brand)); },
  exDetail(el){ exDetail(el.dataset.id); },
  figPlay(el){ if(!ui.fig)return; const on=ui.fig.toggle(); el.textContent=on?"일시정지":"재생"; },
  figSpeed(el){ if(!ui.fig)return; ui.slow=!ui.slow; ui.fig.setSpeed(ui.slow?.45:1); el.textContent=ui.slow?"보통 속도":"느리게"; },
  figView(el){ if(!ui.fig)return; if(el.dataset.y==="def") ui.fig.defaultView(); else ui.fig.setView(+el.dataset.y,12); },
  addExToday(el){ const e=EXMAP[el.dataset.id]; day().workout.items.push(mkItem(e,e.def[0],e.def[1],e.def[2])); markDirty(dayKey(ui.date)); closeSheet(); ui.tab="workout"; render(); toast(`${e.name} 추가됨`); },
  saveWeight(){ const v=+document.getElementById("bwIn").value; if(!v||v<25||v>300) return toast("체중을 kg로 입력해 주세요"); day().weight=r1(v); markDirty(dayKey(ui.date)); if(ui.date>=lastWeightDate()){ S.main.profile.weight=r1(v); markDirty("main"); } render(); toast("체중을 기록했어요"); },
  async aiAsk(){
    const q=document.getElementById("gAsk").value.trim(); if(!q) return; const out=document.getElementById("gAskOut"); out.innerHTML=`<div class="ai-out" style="margin-top:10px">답변 준비 중…</div>`;
    try{ await askText(`헬스 트레이너로서 다음 질문에 답하라. 한국어 존댓말, 마크다운 제목 없이 **굵게**만, 12줄 이내. 통증이 심하거나 지속되면 전문의 상담을 권하라.\n질문: ${q}`, t=>{ out.innerHTML=`<div class="ai-out" style="margin-top:10px">${md(t)}</div>`; }); }
    catch(e){ out.innerHTML=`<p class="small" style="color:var(--bad)">${esc(aiErr(e))}</p>`; }
  },
  timerAdd(el){ timer.end+= +el.dataset.s*1000; tick(); },
  timerStop(){ clearInterval(timer.iv); document.getElementById("timer").classList.remove("on"); }
};
function readReq(){
  const g=id=>document.getElementById(id);
  return {goal:g("rGoal").value,days:+g("rDays").value,level:g("rLevel").value,equip:g("rEquip").value,pref:g("rPref").value,focus:[...document.querySelectorAll("#rFocus .chip.on")].map(b=>b.dataset.p),note:g("rNote").value.trim()};
}
function previewPlan(plan,title,summary){
  ui.pending={plan,title,summary};
  let h=`<div class="spread"><h2>${esc(title)}</h2><button class="btn sm ghost" data-act="closeSheet">닫기</button></div>${summary?`<div class="ai-out">${md(summary)}</div>`:""}<div class="stack">`;
  plan.forEach((p,i)=>{ if(!p.items.length) return; h+=`<div class="card plan-day"><h3>${WD[i]}요일 · ${esc(p.title)}</h3>${p.items.map(it=>{const s=it.sets;const t=exType(it);return `<div class="pi"><span>${esc(it.name)} <span class="chip">${esc(exPart(it))}</span></span><span class="num muted">${s.length}×${s[0]?.r}${t==="t"?"분":"회"}${t==="w"&&s[0]?.w?` · ${s[0].w}kg`:""}</span></div>`}).join("")}</div>`; });
  h+=`</div><div class="card" style="margin-top:10px;background:var(--surface-2)"><h3>근거 기반 점검</h3><div style="margin-top:8px">${feedbackHtml(plan,ui.reqLevel)}</div><div style="margin-top:10px">${planCheckHtml(plan,ui.reqLevel)}</div></div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="applyPlan">이 플랜으로 바꾸기</button><button class="btn" data-act="closeSheet">취소</button></div><p class="xs muted">시작 무게는 예시예요. 첫 주에 실제로 들 수 있는 무게로 조정하면, 그 뒤로는 기록 기반 추천이 무게를 올려 줍니다.</p>`;
  openSheet(h);
}

document.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return; const f=A[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); } });
document.addEventListener("change",e=>{
  const el=e.target; const k=el.dataset.chg; if(!k) return;
  if(k==="set"){ const it=getItems(el.dataset.target)[+el.dataset.i]; it.sets[+el.dataset.k][el.dataset.f]=Math.max(0,+el.value||0); saveTarget(el.dataset.target); if(el.dataset.target==="log") render(); }
  if(k==="rir"){ const s=day().workout.items[+el.dataset.i].sets[+el.dataset.k]; s.rir=el.value; markDirty(dayKey(ui.date)); }
  if(k==="rest"){ getItems(el.dataset.target)[+el.dataset.i].rest=+el.value; saveTarget(el.dataset.target); }
  if(k==="dayTitle"){ S.main.plan[+el.dataset.i].title=el.value.trim()||"운동"; markDirty("main"); }
});
document.addEventListener("input",e=>{
  const el=e.target; const k=el.dataset.inp; if(!k) return;
  if(k==="foodQ"){ ui.sheet.q=el.value; document.getElementById("foodRes").innerHTML=foodResults(); }
  if(k==="exQ"){ ui.sheet.q=el.value; document.getElementById("exRes").innerHTML=exListHtml(); }
  if(k==="guideQ"){ ui.guideQ=el.value; const L=guideFilter(); document.getElementById("guideList").innerHTML=guideCards(L); document.getElementById("guideCount").textContent=`${L.length}개 운동 · 누르면 3D 동작과 타깃 근육을 볼 수 있어요`; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.getElementById("sheet").classList.contains("open")) closeSheet();
  if(e.key==="Enter"&&e.target.id==="gAsk") A.aiAsk();
});

/* 시작 */
S = defaultState();
lsLoad();
render();
initCloud();
</script>
