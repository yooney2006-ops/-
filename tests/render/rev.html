<!DOCTYPE html><html><head><meta charset="utf-8"><style>
:root{--fig-muscle:#e6dccb;--fig-deep:#d8ccb8;--fig-hair:#c9bca6;--fig-tendon:#e6dccb;--fig-head:#e9e0d0;--fig-skin:#e9e0d0;--fig-shorts:#2a2e36;--fig-prim:#d23f2a;--fig-sec:#ef9c76;--fig-metal:#8a909c;--fig-pad:#3a3f4b;--fig-frame:#5b6170;--fig-floor:#e6e9ee;--fig-plate:#3f434c;--fig-bg:#fff}
body{margin:0;font:12px sans-serif;background:#fff;width:1500px;display:flex;flex-wrap:wrap;gap:4px}
.c{width:244px}canvas{width:244px;height:244px;border:1px solid #ddd;display:block}</style></head><body>
<script type="module">
import { EX } from "/src/data/exercises.js";
import { FIG } from "/src/engine/fig.js";
const q=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const ids=q.ids, frames=q.s||[0,1];
const c0=document.createElement('canvas');c0.style.cssText='width:244px;height:244px;position:absolute;left:-9999px';document.body.appendChild(c0);
for(const id of ids){const ex=EX.find(e=>e.id===id);if(!ex){document.body.append('없는 운동: '+id);continue;}for(const fr of frames){const s=Array.isArray(fr)?fr[0]:fr, yy=Array.isArray(fr)?fr[1]:null;const d=document.createElement('div');d.className='c';d.textContent=id+' s='+s+(yy!=null?' y'+yy:'');const c=document.createElement('canvas');c.width=244;c.height=244;d.appendChild(c);document.body.appendChild(d);
 const v=FIG.viewer(c0,ex,{autoplay:false}); if(yy!=null)v.setView(yy,8); v.frameAt(s); c.getContext('2d').drawImage(c0,0,0,244,244); v.stop();}}
document.body.dataset.done="1";
</script></body></html>
