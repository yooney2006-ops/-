<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>짐로그</title>
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>짐로그<span>.</span></h1>
      <div class="row">
        <span class="status" id="saveStatus">저장: <b>준비 중</b></span>
        <button class="btn sm" data-act="openProfile">내 정보·목표</button>
      </div>
    </div>
    <div class="spread">
      <div class="datenav">
        <button class="btn icon" data-act="day" data-d="-1" aria-label="전날">‹</button>
        <div class="d" id="dateLabel"></div>
        <button class="btn icon" data-act="day" data-d="1" aria-label="다음날">›</button>
      </div>
      <button class="btn sm ghost" data-act="today">오늘로</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-act="tab" data-tab="food">식단</button>
      <button role="tab" data-act="tab" data-tab="workout">운동</button>
      <button role="tab" data-act="tab" data-tab="plan">주간 플랜</button>
      <button role="tab" data-act="tab" data-tab="guide">운동 가이드</button>
    </nav>
  </header>
  <main id="view" class="stack"></main>
</div>
<div class="backdrop" id="backdrop" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="timer" id="timer">
  <span class="xs">휴식</span><span class="tt" id="timerT">1:30</span>
  <button data-act="timerAdd" data-s="-15">−15</button><button data-act="timerAdd" data-s="30">+30</button><button data-act="timerStop">끄기</button>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
