<!DOCTYPE html><html><head><meta charset="utf-8"><style>
:root{--fig-muscle:#e4e5e8;--fig-deep:#c9ccd2;--fig-hair:#4b4f58;--fig-tendon:#dcdee2;--fig-head:#e4e5e8;--fig-skin:#c9ced8;--fig-prim:#e4472b;--fig-sec:#f3a57c;--fig-metal:#8a909c;--fig-pad:#3a3f4b;--fig-frame:#5b6170;--fig-floor:#dfe3ea;--fig-bg:#fff}
body{margin:0;font:12px sans-serif;background:#fff;width:1500px}
.r{display:flex;gap:4px}.c{width:296px}canvas{width:296px;height:260px;border:1px solid #ddd;display:block}</style></head><body>
<script src="../src/fig.js"></script>
<script>
const list=JSON.parse(decodeURIComponent(location.hash.slice(1)));
for(const [name,anim,prim] of list){const row=document.createElement('div');row.className='r';document.body.appendChild(row);
 for(const [s,yaw] of [[0,0],[0,150],[1,150],[0,60],[1,60]]){const d=document.createElement('div');d.className='c';d.textContent=name+' s='+s+' yaw='+yaw;const c=document.createElement('canvas');d.appendChild(c);row.appendChild(d);
 const rig=FIG.makeRig(anim);const JA=rig.at(0);const J=rig.at(s);const musc={};(prim||[]).forEach(m=>musc[m]=1);
 c.width=296;c.height=260;const ctx=c.getContext('2d');const view={dist:4.2,span:2.6,...rig.P.cam,yaw,pitch:8};
 FIG.draw(ctx,296,260,FIG.scene(J,rig.P.props(J,{JA}),musc),view,FIG.palette(c));}}
</script></body></html>
